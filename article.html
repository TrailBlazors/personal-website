<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Your Name</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Additional styles for article page */
        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 120px 20px 60px;
        }
        
        .article-header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .article-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .article-meta {
            color: var(--light-text);
        }
        
        .article-content {
            line-height: 1.8;
        }
        
        .article-content h2 {
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        .article-content p {
            margin-bottom: 20px;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 30px 0;
        }
        
        .article-content ul, .article-content ol {
            margin-bottom: 20px;
            padding-left: 20px;
        }
        
        .article-content li {
            margin-bottom: 10px;
        }
        
        .article-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: var(--light-text);
        }
        
        .article-content code {
            background-color: var(--light-background);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .article-content pre {
            background-color: var(--light-background);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 30px 0;
        }
        
        .article-content pre code {
            background-color: transparent;
            padding: 0;
        }
        
        .back-to-articles {
            display: inline-block;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">Your Name</a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#experience">Experience</a></li>
                    <li><a href="index.html#articles">Articles</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <div class="article-container">
        <div class="article-header">
            <!-- Article title and meta will be inserted here by JavaScript -->
        </div>
        
        <div id="article-content" class="article-content">
            <!-- Article content will be inserted here by JavaScript -->
            <p>Loading article...</p>
        </div>
        
        <a href="index.html#articles" class="back-to-articles">
            <i class="fas fa-arrow-left"></i> Back to Articles
        </a>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 Your Name. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
